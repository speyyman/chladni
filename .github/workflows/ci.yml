name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -w chladni
      - run: npm run typecheck
      - run: npm test
      - name: Browser for the end-to-end checks
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
